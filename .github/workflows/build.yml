name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (MSVC, Qt 6)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: build\labelforge_selftest.exe build\selftest-out

      - name: Deploy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/LabelForge | Out-Null
          Copy-Item build/LabelForge.exe dist/LabelForge/
          windeployqt --release --compiler-runtime --no-opengl-sw --no-system-d3d-compiler dist/LabelForge/LabelForge.exe
          Copy-Item LICENSE, README.md dist/LabelForge/
          Copy-Item -Recurse examples dist/LabelForge/examples
          Compress-Archive -Path dist/LabelForge -DestinationPath dist/LabelForge-windows-x64.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc packaging/windows/labelforge.iss

      - uses: actions/upload-artifact@v4
        with:
          name: LabelForge-windows-x64
          path: |
            dist/LabelForge-windows-x64.zip
            dist/LabelForge-*-setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LabelForge-windows-x64.zip
            dist/LabelForge-*-setup.exe

  linux:
    name: Linux (tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev cmake ninja-build
          pip install zxing-cpp pillow openpyxl
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 tests/make_test_xlsx.py build/test.xlsx
          ./build/labelforge_selftest build/selftest-out build/test.xlsx
          python3 tests/verify_barcodes.py build/selftest-out
          ./build/labelforge_uitest build/uitest-out
